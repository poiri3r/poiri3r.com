<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homepage | Logs</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">Poiri3r</a>
      <button class="nav-toggle" type="button">Menu</button>
      <nav class="nav">
        <ul class="nav-list">
          <li><a href="/">Home</a></li>
          <li><a href="/portfolio">Portfolio</a></li>
          <li><a href="/#stack">Stack</a></li>
          <li><a class="active" href="/logs">Logs</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="page-header" style="display:flex; justify-content:space-between; align-items:flex-end;">
      <div>
        <h1>Logs</h1>
        <p class="muted">보안 대시보드</p>
      </div>
      <button class="refresh-btn" id="refresh-btn" onclick="loadAll()" style="margin-bottom:22px;">새로고침</button>
    </section>

    <!-- 차트 그리드 -->
    <section class="section">
      <div class="dashboard-grid">
        <div class="card chart-card">
          <p class="chart-title">전체 방문자 국가</p>
          <div class="chart-wrap"><canvas id="chart-visitor-countries"></canvas></div>
        </div>
        <div class="card chart-card">
          <p class="chart-title">공격자 국가</p>
          <div class="chart-wrap"><canvas id="chart-attack-countries"></canvas></div>
        </div>
        <div class="card chart-card">
          <p class="chart-title">정상 / 이상 트래픽 비율</p>
          <div class="chart-wrap"><canvas id="chart-traffic-ratio"></canvas></div>
        </div>
        <div class="card chart-card">
          <p class="chart-title">차단 이유</p>
          <div class="chart-wrap"><canvas id="chart-block-reasons"></canvas></div>
        </div>
      </div>
    </section>

    <!-- 탭 -->
    <section class="section">
      <div class="log-tab-bar">
        <button class="log-tab active" onclick="showTab('nginx', this)">Nginx 로그</button>
        <button class="log-tab" onclick="showTab('alerts', this)">CrowdSec 알림</button>
      </div>

      <!-- Nginx 로그 탭 -->
      <div id="tab-nginx" class="tab-content">
        <div class="card" style="padding:0; overflow:hidden;">
          <table class="table">
            <thead>
              <tr><th>시각 (KST)</th><th>IP</th><th>메서드</th><th>경로</th></tr>
            </thead>
            <tbody id="nginx-tbody">
              <tr><td colspan="4" class="muted" style="padding:20px;">로딩 중...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination">
          <button id="nginx-prev" onclick="nginxPage--; renderNginxPage();" disabled>← 이전</button>
          <span id="nginx-page-info" class="muted">— / —</span>
          <button id="nginx-next" onclick="nginxPage++; renderNginxPage();" disabled>다음 →</button>
        </div>
      </div>

      <!-- CrowdSec 알림 탭 -->
      <div id="tab-alerts" class="tab-content" style="display:none;">
        <div class="card" style="padding:0; overflow:hidden;">
          <table class="table">
            <thead>
              <tr><th>시각</th><th>IP</th><th>조치</th><th>국가</th><th>시나리오</th><th>이벤트 수</th></tr>
            </thead>
            <tbody id="alerts-tbody">
              <tr><td colspan="6" class="muted" style="padding:20px;">로딩 중...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination">
          <button id="alerts-prev" onclick="alertsPage--; renderAlertsPage();" disabled>← 이전</button>
          <span id="alerts-page-info" class="muted">— / —</span>
          <button id="alerts-next" onclick="alertsPage++; renderAlertsPage();" disabled>다음 →</button>
        </div>
      </div>

    </section>
  </main>

  <footer class="footer">
    <div class="container">© 2026 poiri3r</div>
  </footer>

  <script src="/static/js/app.js"></script>
  <script>
    // ── Chart.js 기본 설정 ──────────────────────────────
    Chart.defaults.color = '#b6b6b6';
    Chart.defaults.borderColor = '#2d2d2d';

    const CHART_COLORS = [
      'rgba(215,25,32,0.8)', 'rgba(100,150,255,0.8)', 'rgba(50,200,100,0.8)',
      'rgba(255,165,0,0.8)', 'rgba(180,80,255,0.8)', 'rgba(0,200,200,0.8)',
      'rgba(255,100,150,0.8)', 'rgba(150,255,100,0.8)', 'rgba(255,200,0,0.8)',
      'rgba(100,200,255,0.8)'
    ];

    let charts = {};

    function destroyChart(id) {
      if (charts[id]) { charts[id].destroy(); delete charts[id]; }
    }

    // ── 차트 렌더링 ─────────────────────────────────────
    function renderBarChart(id, labels, data, label) {
      destroyChart(id);
      const ctx = document.getElementById(id).getContext('2d');
      charts[id] = new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            label,
            data,
            backgroundColor: CHART_COLORS,
            borderRadius: 6,
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: '#1e1e1e' }, ticks: { color: '#b6b6b6', precision: 0 } },
            y: { grid: { display: false }, ticks: { color: '#e8e8e8' } }
          }
        }
      });
    }

    function renderDoughnutChart(id, labels, data) {
      destroyChart(id);
      const ctx = document.getElementById(id).getContext('2d');
      charts[id] = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels,
          datasets: [{
            data,
            backgroundColor: ['rgba(50,200,100,0.8)', 'rgba(215,25,32,0.8)'],
            borderWidth: 0,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { color: '#b6b6b6', padding: 16 } }
          }
        }
      });
    }

    function renderDashboard(data) {
      // 방문자 국가
      if (data.visitor_countries?.length) {
        renderBarChart('chart-visitor-countries',
          data.visitor_countries.map(d => d.country),
          data.visitor_countries.map(d => d.count), '방문자 수');
      }
      // 공격자 국가
      if (data.attack_countries?.length) {
        renderBarChart('chart-attack-countries',
          data.attack_countries.map(d => d.country),
          data.attack_countries.map(d => d.count), '공격 수');
      }
      // 트래픽 비율
      if (data.traffic_ratio) {
        renderDoughnutChart('chart-traffic-ratio',
          ['정상', '이상'],
          [data.traffic_ratio.normal, data.traffic_ratio.suspicious]);
      }
      // 차단 이유
      if (data.block_reasons?.length) {
        renderBarChart('chart-block-reasons',
          data.block_reasons.map(d => d.reason.replace('crowdsecurity/', '')),
          data.block_reasons.map(d => d.count), '차단 수');
      }
    }

    // ── 시간 변환 (nginx UTC → KST) ─────────────────────
    const _MONTHS = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
    function toKST(raw) {
      const m = raw.match(/(\d{2})\/(\w{3})\/(\d{4}):(\d{2}):(\d{2}):(\d{2})/);
      if (!m) return raw;
      const kst = new Date(Date.UTC(+m[3], _MONTHS[m[2]], +m[1], +m[4], +m[5], +m[6]) + 9 * 3600000);
      const p = n => String(n).padStart(2, '0');
      return `${kst.getUTCFullYear()}-${p(kst.getUTCMonth()+1)}-${p(kst.getUTCDate())} ${p(kst.getUTCHours())}:${p(kst.getUTCMinutes())}`;
    }

    // CrowdSec ISO 타임스탬프 → KST "YYYY-MM-DD HH:MM:SS"
    function formatCSTime(raw) {
      if (!raw) return '—';
      const d = new Date(raw);
      if (isNaN(d)) return raw;
      const kst = new Date(d.getTime() + 9 * 3600000);
      const p = n => String(n).padStart(2, '0');
      return `${kst.getUTCFullYear()}-${p(kst.getUTCMonth()+1)}-${p(kst.getUTCDate())} ${p(kst.getUTCHours())}:${p(kst.getUTCMinutes())}:${p(kst.getUTCSeconds())}`;
    }

    // ── Nginx 페이지네이션 ───────────────────────────────
    let nginxData = [];
    let nginxPage = 0;
    const PAGE_SIZE = 10;

    function renderNginxPage() {
      const tbody = document.getElementById('nginx-tbody');
      const totalPages = Math.max(1, Math.ceil(nginxData.length / PAGE_SIZE));
      const slice = nginxData.slice(nginxPage * PAGE_SIZE, (nginxPage + 1) * PAGE_SIZE);

      tbody.innerHTML = slice.map(e => `
        <tr>
          <td class="log-time">${toKST(e.time)}</td>
          <td class="log-ip">${e.ip}</td>
          <td><span class="log-method">${e.method}</span></td>
          <td class="log-path">${e.path}</td>
        </tr>`).join('');

      document.getElementById('nginx-page-info').textContent = `${nginxPage + 1} / ${totalPages}`;
      document.getElementById('nginx-prev').disabled = nginxPage === 0;
      document.getElementById('nginx-next').disabled = nginxPage >= totalPages - 1;
    }

    // ── 테이블 렌더링 ────────────────────────────────────
    function renderNginx(data) {
      nginxData = data || [];
      nginxPage = 0;
      if (!nginxData.length) {
        document.getElementById('nginx-tbody').innerHTML =
          '<tr><td colspan="4" class="muted" style="padding:20px;">로그가 없습니다.</td></tr>';
        return;
      }
      renderNginxPage();
    }

    let alertsData = [], alertsPage = 0;
    let decisionsData = [], decisionsPage = 0;

    function renderAlertsPage() {
      const tbody = document.getElementById('alerts-tbody');
      const totalPages = Math.max(1, Math.ceil(alertsData.length / PAGE_SIZE));
      const slice = alertsData.slice(alertsPage * PAGE_SIZE, (alertsPage + 1) * PAGE_SIZE);
      tbody.innerHTML = slice.map(e => `
        <tr>
          <td class="log-time">${formatCSTime(e.created_at)}</td>
          <td class="log-ip">${e.source_ip}</td>
          <td><span class="badge">${e.action || '—'}</span></td>
          <td>${e.source_country || '—'}</td>
          <td class="log-path">${e.scenario.replace('crowdsecurity/', '')}</td>
          <td>${e.events_count}</td>
        </tr>`).join('');
      document.getElementById('alerts-page-info').textContent = `${alertsPage + 1} / ${totalPages}`;
      document.getElementById('alerts-prev').disabled = alertsPage === 0;
      document.getElementById('alerts-next').disabled = alertsPage >= totalPages - 1;
    }

    function renderDecisionsPage() {
      const tbody = document.getElementById('decisions-tbody');
      const totalPages = Math.max(1, Math.ceil(decisionsData.length / PAGE_SIZE));
      const slice = decisionsData.slice(decisionsPage * PAGE_SIZE, (decisionsPage + 1) * PAGE_SIZE);
      tbody.innerHTML = slice.map(e => `
        <tr>
          <td class="log-time">${formatCSTime(e.created_at)}</td>
          <td class="log-ip">${e.value}</td>
          <td class="log-path">${e.scenario.replace('crowdsecurity/', '')}</td>
          <td><span class="badge">${e.type}</span></td>
          <td class="log-time">${formatCSTime(e.until)}</td>
        </tr>`).join('');
      document.getElementById('decisions-page-info').textContent = `${decisionsPage + 1} / ${totalPages}`;
      document.getElementById('decisions-prev').disabled = decisionsPage === 0;
      document.getElementById('decisions-next').disabled = decisionsPage >= totalPages - 1;
    }

    function renderAlerts(data) {
      alertsData = data || [];
      alertsPage = 0;
      if (!alertsData.length) {
        document.getElementById('alerts-tbody').innerHTML =
          '<tr><td colspan="6" class="muted" style="padding:20px;">알림이 없습니다.</td></tr>';
        return;
      }
      renderAlertsPage();
    }

    function renderDecisions(data) {
      decisionsData = data || [];
      decisionsPage = 0;
      if (!decisionsData.length) {
        document.getElementById('decisions-tbody').innerHTML =
          '<tr><td colspan="5" class="muted" style="padding:20px;">차단 목록이 없습니다.</td></tr>';
        return;
      }
      renderDecisionsPage();
    }

    // ── 탭 전환 ─────────────────────────────────────────
    function showTab(name, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.log-tab').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + name).style.display = 'block';
      btn.classList.add('active');
    }

    // ── 데이터 로드 ──────────────────────────────────────
    function loadAll() {
      const btn = document.getElementById('refresh-btn');
      btn.disabled = true;
      btn.textContent = '불러오는 중...';

      Promise.all([
        fetch('/api/dashboard').then(r => r.json()),
        fetch('/api/visitors/detail').then(r => r.json()),
        fetch('/api/crowdsec/alerts').then(r => r.json()),
      ]).then(([dashboard, nginx, alerts]) => {
        renderDashboard(dashboard);
        renderNginx(nginx);
        renderAlerts(alerts);
      }).catch(() => {}).finally(() => {
        btn.disabled = false;
        btn.textContent = '새로고침';
      });
    }

    loadAll();
  </script>
</body>
</html>
